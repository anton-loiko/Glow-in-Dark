# CI (task_8 §6): строгая проверка скриптов, юнит-тесты gdUnit4, RunBot (10:00 и стресс 150 врагов),
# сборка Android debug APK (выключена до V1.1, D19). Отчёты тестов и бота — артефакты.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2
  GODOT_BIN: ${{ github.workspace }}/.godot-bin/godot

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 .godot-bin/godot
          chmod +x .godot-bin/godot

      - name: Import project
        run: $GODOT_BIN --headless --import || true

      - name: Strict script check + unit tests
        run: GODOT_BIN=$GODOT_BIN tools/run_tests.sh

      - name: RunBot 10:00
        run: $GODOT_BIN --headless --fixed-fps 60 --script res://tests/bots/RunBot.gd -- --seconds=600 && mv reports/bot/run_bot.json reports/bot/run_bot_normal.json

      - name: RunBot stress (150 enemies)
        run: $GODOT_BIN --headless --fixed-fps 60 --script res://tests/bots/RunBot.gd -- --stress --seconds=300 && mv reports/bot/run_bot.json reports/bot/run_bot_stress.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  # D19: V1 — только iOS. Сборка Android заморожена до V1.1 (включить — убрать `if: false`).
  android:
    if: false
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Download Godot + export templates
        run: |
          mkdir -p .godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          mv .godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 .godot-bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Debug keystore + editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Export Android debug APK
        run: |
          $GODOT_BIN --headless --import || true
          $GODOT_BIN --headless --install-android-build-template
          mkdir -p build/android
          $GODOT_BIN --headless --export-debug "Android" build/android/glow-in-the-dark.apk
          test -f build/android/glow-in-the-dark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android/glow-in-the-dark.apk
